[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-keyframe"
version = "0.1.0"
description = "CLI tool for video keyframe extraction and gallery generation"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "tqdm>=4.65.0",
    "easyocr>=1.7.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
video-keyframe = "video_keyframe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
